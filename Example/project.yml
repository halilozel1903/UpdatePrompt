name: UpdatePromptDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
packages:
  UpdatePrompt:
    path: ..
targets:
  UpdatePromptDemo:
    type: application
    platform: iOS
    sources:
      - UpdatePromptDemo
    dependencies:
      - package: UpdatePrompt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.UpdatePromptDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  UpdatePromptDemo:
    build:
      targets:
        UpdatePromptDemo: all
    run:
      config: Debug
