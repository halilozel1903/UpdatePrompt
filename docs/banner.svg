<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="UpdatePrompt: tell users a new app version is ready, the SwiftUI way" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8fff"/>
      <stop offset="1" stop-color="#6e4df5"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="900" cy="150" r="230" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1130" cy="440" r="210" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">UpdatePrompt</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">“A new version is available”, the SwiftUI way</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="106" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="135" y="357" fill="#e2e8f0" text-anchor="middle">iOS 26</text>
      <rect x="200" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="260" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="332" y="330" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="380" y="357" fill="#e2e8f0" text-anchor="middle">SPM</text>
      <rect x="440" y="330" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="515" y="357" fill="#e2e8f0" text-anchor="middle">App Store</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="760" y="60" width="400" height="440" rx="44" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <rect x="936" y="74" width="48" height="6" rx="3" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="918" y="104" width="84" height="84" rx="19" fill="url(#icon)"/>
      <rect x="944" y="124" width="32" height="36" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
      <path d="M960 128 v24 M950 143 l10 10 l10 -10" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="960" y="230" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">Update Available</text>
      <rect x="880" y="248" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="960" y="272" fill="#e2e8f0" font-size="18" font-weight="600" text-anchor="middle">2.3.1  →  2.4.0</text>
      <rect x="796" y="300" width="328" height="84" rx="18" fill="#ffffff" fill-opacity="0.08"/>
      <text x="816" y="328" fill="#ffffff" font-size="17" font-weight="700">What's New</text>
      <text x="816" y="352" fill="#cbd5e1" font-size="15">• Home Screen widgets</text>
      <text x="816" y="372" fill="#cbd5e1" font-size="15">• Sync is up to twice as fast</text>
      <rect x="796" y="400" width="328" height="44" rx="22" fill="#3b82f6"/>
      <text x="960" y="428" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">Update Now</text>
      <rect x="796" y="452" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.14"/>
      <text x="876" y="476" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Later</text>
      <rect x="964" y="452" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.14"/>
      <text x="1044" y="476" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Skip Version</text>
    </g>
  </g>
</svg>
